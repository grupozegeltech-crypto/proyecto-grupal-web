<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel Repartidor | LavaExpress Lima</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="repartidor.css">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

    <!-- =====================================================
         MENÚ LATERAL
    ====================================================== -->

    <aside class="sidebar">

        <h2>
            🚚 LavaExpress
        </h2>

        <button id="menuDashboard">

            <i class="fas fa-chart-line"></i>

            Dashboard

        </button>

        <button id="menuPedidos">

            <i class="fas fa-box"></i>

            Mis Pedidos

        </button>

        <button id="menuPagos">

            <i class="fas fa-money-bill-wave"></i>

            Pagos

        </button>

        <button id="cerrarSesion">

            <i class="fas fa-right-from-bracket"></i>

            Cerrar sesión

        </button>

    </aside>

    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main class="contenido">

        <!-- Cabecera -->

        <div class="dashboard-header">

            <div>

                <h1>

                    🚚 Panel del Repartidor

                </h1>

                <p>

                    Bienvenido

                    <strong id="nombreRepartidor">

                        Repartidor

                    </strong>

                </p>

            </div>

            <div class="fecha-dashboard">

                <span id="fechaActual"></span>

            </div>

        </div>

        <!-- =====================================================
             TARJETAS
        ====================================================== -->

        <section id="seccionDashboard">

        <div class="dashboard-grid">

            <div class="dashboard-card">

                <h3>

                    📦 Pedidos Asignados

                </h3>

                <span id="totalPedidos">

                    0

                </span>

            </div>

            <div class="dashboard-card card-pendientes">

                <h3>

                    💰 Pendientes de Pago

                </h3>

                <span id="pendientesPago">

                    0

                </span>

            </div>

            <div class="dashboard-card card-pagados">

                <h3>

                    ✅ Pagados

                </h3>

                <span id="pedidosPagados">

                    0

                </span>

            </div>

        

        </div>

        </section>

        




<section id="seccionPedidos">
        <!-- =====================================================
     PANEL DE ACCIONES
====================================================== -->

        <div class="panel-acciones">

            <button id="btnRecojos" class="btn-panel btn-recojos">

                📦 Pedidos para Recojo

            </button>

            <button id="btnEntregas" class="btn-panel btn-entregas">

                🚚 Pedidos para Entrega

            </button>

        </div>

        <!-- =====================================================
     AQUÍ SE CARGARÁN LOS PEDIDOS
====================================================== -->

        <section id="listaPedidos">

            <!-- repartidor.js cargará aquí las tarjetas -->

        </section>

        </section>  

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="repartidor.js"></script>

</body>

</html>
